name: HRX IQ login

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Selenium
        run: pip install selenium

      - name: Run script
        run: python3 hrxiq_login.py
